services:
  archive:
    build: .
    image: animal-house-archive:latest
    container_name: animal-house-archive
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET를 .env에 32자 이상으로 넣으세요}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 비워 두면 첫 접속 때 /setup 화면에서 관리자 계정을 만든다.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # 호스트 폴더가 없으면 Docker가 root 소유로 만들지만, entrypoint가 node 소유로 바꿔 준다.
      - ./data:/data
